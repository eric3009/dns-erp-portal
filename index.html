<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>D&amp;S ERP Portal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: ERP work surface. Side rail of modules, list/detail panes, tablet-sized counter. Accent is a hue the user picks; neutrals stay fixed per theme. */
:root{
  --hue:178; --chroma:.105;
  --bg:#EEF2F0; --surface:#FFFFFF; --sunk:#F5F8F6; --ink:#13221F; --muted:#5A6B66; --line:#D8E0DC; --scrim:rgba(10,20,18,.42);
  --accent:oklch(.50 var(--chroma) var(--hue)); --accent-ink:#FFFFFF; --accent-soft:oklch(.945 calc(var(--chroma)*.3) var(--hue));
  --good:#17784A; --good-soft:#DFF2E7; --warn:#9A6212; --warn-soft:#FBEFD9; --bad:#B42318; --bad-soft:#FBE4E1; --info:#24578F; --info-soft:#E1EBF7;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px; --pad:16px; --cell:8px 12px; --gap:16px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1513; --surface:#151F1C; --sunk:#111917; --ink:#E3ECE8; --muted:#93A49F; --line:#26332F; --scrim:rgba(0,0,0,.55);
  --accent:oklch(.76 calc(var(--chroma)*1.1) var(--hue)); --accent-ink:#06201A; --accent-soft:oklch(.31 calc(var(--chroma)*.45) var(--hue));
  --good:#52C487; --good-soft:#163324; --warn:#E3AA4C; --warn-soft:#382B15; --bad:#F27B6F; --bad-soft:#3C1C19; --info:#7FB0EA; --info-soft:#18283C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#151F1C; --sunk:#111917; --ink:#E3ECE8; --muted:#93A49F; --line:#26332F; --scrim:rgba(0,0,0,.55);
  --accent:oklch(.76 calc(var(--chroma)*1.1) var(--hue)); --accent-ink:#06201A; --accent-soft:oklch(.31 calc(var(--chroma)*.45) var(--hue));
  --good:#52C487; --good-soft:#163324; --warn:#E3AA4C; --warn-soft:#382B15; --bad:#F27B6F; --bad-soft:#3C1C19; --info:#7FB0EA; --info-soft:#18283C; color-scheme:dark}
:root[data-accent="blue"]{--hue:252}
:root[data-accent="clay"]{--hue:42; --chroma:.12}
:root[data-accent="plum"]{--hue:320}
:root[data-accent="graphite"]{--hue:200; --chroma:.012}
:root[data-density="compact"]{--pad:11px; --cell:5px 10px; --gap:11px}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
.t .mono,.t a.mono{white-space:nowrap}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.92em}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:22px;font-weight:700}
h2{font-size:17px;font-weight:600}
h3{font-size:14px;font-weight:600}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
select,input[type=text],input[type=number],input[type=date],input[type=search],textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
textarea{width:100%;resize:vertical}
input[type=range]{accent-color:var(--accent);width:100%}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding-block:9px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.mark{width:28px;height:28px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);flex:none;transition:background .3s}
.brand b{font-family:var(--f-display);font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.proto{font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-soft);padding:2px 8px;border-radius:999px;white-space:nowrap}
.icon-btn{position:relative;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:7px;height:34px;padding:0 9px;cursor:pointer;color:var(--ink)}
.icon-btn:hover{border-color:var(--accent)}
.icon-btn svg{flex:none}
.icon-btn .dot{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;border-radius:999px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:600;display:grid;place-items:center;padding:0 4px}
.kbd{font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.searchbtn{min-width:220px;justify-content:flex-start;color:var(--muted)}
.searchbtn .kbd{margin-left:auto}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:11.5px;flex:none}
.ctl{display:flex;align-items:center;gap:6px}
.ctl label{font-size:12px;color:var(--muted)}

/* Banner */
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--warn-soft);border-bottom:1px solid var(--line);font-size:13px}
.banner.bad{background:var(--bad-soft)}

/* Shell */
.shell{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:calc(100% - 53px)}
.side{border-right:1px solid var(--line);background:var(--sunk);padding:14px 10px;display:flex;flex-direction:column;gap:2px;padding-left:max(10px,env(safe-area-inset-left,0px))}
.side a{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:6px;color:var(--ink);text-decoration:none;font-weight:500;transition:background .15s}
.side a:hover{background:var(--surface)}
.side a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600;padding:12px 10px 4px}
.side .count{font-size:11px;font-weight:600;background:var(--warn);color:var(--surface);border-radius:999px;padding:0 7px;line-height:18px}
.side .count.bad{background:var(--bad)}
.side .count.acc{background:var(--accent);color:var(--accent-ink)}
main{min-width:0;padding-block:20px 56px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.view{display:flex;flex-direction:column;gap:var(--gap)}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head p{margin:4px 0 0;color:var(--muted);max-width:70ch}

/* Pieces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);min-width:0}
.card.flush{padding:0;overflow:hidden}
.card > h2,.card > h3{margin-bottom:10px}
.cardhead{padding:14px var(--pad) 6px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:var(--gap)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;text-align:left;cursor:pointer;transition:border-color .15s,transform .15s var(--ease)}
.tile:hover{border-color:var(--accent);transform:translateY(-1px)}
.tile .v{font-family:var(--f-display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.tile .l{font-size:12px;color:var(--muted)}
.tile.static{cursor:default}.tile.static:hover{transform:none;border-color:var(--line)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap;transition:border-color .15s,filter .15s,transform .1s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.spin{width:10px;height:10px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;display:inline-block;animation:spin .8s linear infinite}
.note{border-radius:6px;padding:10px 12px;font-size:13px}
.note.warn{background:var(--warn-soft);border-left:3px solid var(--warn)}
.note.bad{background:var(--bad-soft);border-left:3px solid var(--bad)}
.note.good{background:var(--good-soft);border-left:3px solid var(--good)}
.note.info{background:var(--info-soft);border-left:3px solid var(--info)}
.note ul{margin:4px 0 0;padding-left:18px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color .15s,border-color .2s}
.tabs button[aria-selected="true"]{color:var(--accent);border-color:var(--accent);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px;background:var(--sunk)}
.seg button{border:0;background:none;padding:5px 10px;border-radius:5px;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.scroll{overflow-x:auto}
table.t{width:100%;border-collapse:collapse}
.t th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:var(--cell);border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
.t td{padding:var(--cell);border-bottom:1px solid var(--line);vertical-align:top}
.t tr:last-child td{border-bottom:0}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--sunk)}
.t tr.here td{background:var(--accent-soft)}
.t th.num{text-align:right}
.t td.c,.t th.c{text-align:center}
.split{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:var(--gap);align-items:start}
.list{display:flex;flex-direction:column;max-height:70vh;overflow:auto}
.li{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border:0;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;background:none;width:100%;transition:background .12s}
.li:hover{background:var(--sunk)}
.li[aria-selected="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.li .s{font-size:12px;color:var(--muted)}
.li .r{text-align:right;white-space:nowrap}
.searchbar{display:flex;gap:8px;padding:12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.searchbar input{flex:1 1 140px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 18px}
.kv div span{display:block;font-size:11.5px;color:var(--muted)}
.kv div b{font-weight:500}
.bar{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);transform-origin:left;animation:grow .6s var(--ease)}
.bar.warn i{background:var(--warn)} .bar.bad i{background:var(--bad)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.field .err{font-size:12px;color:var(--bad)}
.field.invalid input,.field.invalid textarea{border-color:var(--bad)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .wide{grid-column:1/-1}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.hist li{display:grid;grid-template-columns:96px 1fr;gap:10px;font-size:13px}
.hist li > span:first-child{color:var(--muted);font-size:12px}
.rule{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.rule:last-child{border-bottom:0}
.rule .k{font-family:var(--f-mono);font-size:12px;color:var(--accent);font-weight:500;padding-top:1px}
.phase{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.phase > div{padding:12px;border-right:1px solid var(--line);background:var(--surface)}
.phase > div:last-child{border-right:0}
.phase > div.on{background:var(--accent-soft)}
.phase b{display:block;font-family:var(--f-display);font-size:13px;margin:2px 0}
.phase p{margin:0;font-size:12.5px;color:var(--muted)}
.cache{font-size:11.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.cache::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--good)}

/* Counter */
.counter{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,1fr);gap:var(--gap);align-items:start}
.scan{display:flex;gap:8px}
.scan input{flex:1;font-size:17px;padding:12px 14px;font-family:var(--f-mono)}
.tpls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tpl{border:1px solid var(--line);background:var(--sunk);border-radius:var(--r);padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;transition:border-color .15s,background .15s,transform .15s var(--ease)}
.tpl:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-1px)}
.tpl b{font-family:var(--f-display);font-weight:600}
.tpl span{font-size:12px;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.qi{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:9px 10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:1px;min-height:64px;transition:border-color .15s,transform .1s}
.qi:hover{border-color:var(--accent)}
.qi:active{transform:scale(.97)}
.qi .c{font-family:var(--f-mono);font-size:11.5px;color:var(--accent)}
.qi .d{font-size:12.5px;line-height:1.25}
.qi .p{font-size:12px;color:var(--muted);margin-top:auto}
.cart{position:sticky;top:72px}
.cl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.cl.flash{animation:flash 1s var(--ease)}
.cl .ctrls{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.cl input{width:64px;padding:4px 6px}
.step{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.step button{border:0;background:var(--sunk);width:30px;cursor:pointer;font-size:15px}
.step input{border:0;border-radius:0;width:56px;text-align:center}
.total{display:flex;justify-content:space-between;align-items:baseline;padding-top:12px}
.total b{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}

/* Overlays */
.ov{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;justify-content:flex-end;animation:fade .18s ease-out}
.drawer{background:var(--surface);width:min(620px,100%);height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;animation:slidein .26s var(--ease);
  padding-top:max(20px,env(safe-area-inset-top,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-bottom:max(20px,env(safe-area-inset-bottom,0px))}
.ov.leaving{animation:fadeout .17s ease-in forwards}
.ov.leaving .drawer{animation:slideout .17s ease-in forwards}
.drawer .x{align-self:flex-end}
.pal-ov{position:fixed;inset:0;background:var(--scrim);z-index:45;display:flex;justify-content:center;align-items:flex-start;padding:max(70px,calc(env(safe-area-inset-top,0px) + 60px)) 16px 16px;animation:fade .15s}
.pal{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:min(620px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden;animation:pop .2s var(--ease)}
.pal input{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:14px 16px;font-size:16px;background:transparent}
.pal input:focus{outline:none}
.pal .res{max-height:min(420px,60vh);overflow:auto;padding:6px}
.pal .g{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600;padding:8px 10px 4px}
.pal .o{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer;width:100%;border:0;background:none;text-align:left}
.pal .o[aria-selected="true"]{background:var(--accent-soft)}
.pal .o span:last-child{color:var(--muted);font-size:12px;white-space:nowrap}
.pal .foot{border-top:1px solid var(--line);padding:8px 12px;font-size:11.5px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.pop{position:fixed;z-index:35;top:calc(env(safe-area-inset-top,0px) + 58px);right:max(16px,env(safe-area-inset-right,0px));width:min(340px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 40px rgba(0,0,0,.18);padding:14px;display:flex;flex-direction:column;gap:14px;animation:drop .18s var(--ease);max-height:calc(100% - 80px);overflow:auto}
.pop .row{display:flex;flex-direction:column;gap:6px}
.swatches{display:flex;gap:8px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;transition:transform .15s var(--ease)}
.sw:hover{transform:scale(1.1)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.notif{display:flex;flex-direction:column;gap:2px;padding:9px 10px;border-radius:6px;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.notif:hover{background:var(--sunk)}
.notif.unread{background:var(--accent-soft)}
.notif span{font-size:11.5px;color:var(--muted)}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;width:calc(100% - 32px);max-width:440px;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;box-shadow:0 6px 24px rgba(0,0,0,.2);animation:toastin .3s var(--ease);display:flex;gap:8px;align-items:center}
.toast.good::before{content:"✓";color:var(--good)}
.toast.bad::before{content:"!";color:var(--bad);font-weight:700}

/* Sign-in */
.signin{min-height:100%;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.signin-box{width:min(880px,100%);display:flex;flex-direction:column;gap:20px}
.signin-box h1{font-size:30px}
.users{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.ucard{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:border-color .15s,transform .2s var(--ease),box-shadow .2s}
.ucard:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.08)}
.ucard[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.ucard .top2{display:flex;gap:10px;align-items:center}
.ucard .avatar{width:34px;height:34px;font-size:13px}

/* Matrix */
.mx td:first-child{min-width:240px}
.mx .area td{background:var(--sunk);font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.lock{font-size:11px;color:var(--muted)}

/* Motion */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0}}
@keyframes fadeout{to{opacity:0}}
@keyframes slidein{from{transform:translateX(40px);opacity:.4}}
@keyframes slideout{to{transform:translateX(40px);opacity:0}}
@keyframes pop{from{transform:translateY(-8px) scale(.98);opacity:0}}
@keyframes drop{from{transform:translateY(-6px);opacity:0}}
@keyframes toastin{from{transform:translateY(14px);opacity:0}}
@keyframes rise{from{transform:translateY(8px);opacity:0}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--good)}100%{box-shadow:0 0 0 8px transparent}}
.view.enter > *{animation:rise .32s var(--ease) both}
.view.enter > *:nth-child(2){animation-delay:.04s}
.view.enter > *:nth-child(3){animation-delay:.08s}
.view.enter > *:nth-child(4){animation-delay:.12s}
.view.enter > *:nth-child(n+5){animation-delay:.16s}
.chip.pulse{animation:pulse .9s ease-out}
:root[data-motion="off"] *,:root[data-motion="off"] *::before{animation-duration:0s!important;animation-delay:0s!important;transition-duration:0s!important}
:root[data-motion="off"] .spin{animation-duration:.8s!important}
@media (prefers-reduced-motion:reduce){*,*::before{animation-duration:0s!important;animation-delay:0s!important;transition-duration:0s!important}.spin{animation:none;border-right-color:currentColor;opacity:.6}}

@media (max-width:1100px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.counter{grid-template-columns:1fr}.cart{position:static}.searchbtn{min-width:0}.searchbtn .lbl,.searchbtn .kbd{display:none}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
  .side a{white-space:nowrap}
  .side .grp{display:none}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .split,.g2{grid-template-columns:1fr}
  .phase{grid-template-columns:1fr 1fr}
  .phase > div:nth-child(2){border-right:0}
  .phase > div:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .list{max-height:40vh}
  .branchctl label{display:none}
}
@media (max-width:560px){.form,.tpls{grid-template-columns:1fr}.brand .proto,.branchctl,.uname{display:none}.top{gap:6px}}

/* ============ BC sync engine ============ */
function enqueue(docId, op){
  const o = {id:'TX-' + (DB.seq.TX++), docId, op, status:'queued', attempts:0, created:Date.now(), nextAt:0, by:user()?.name || 'Portal'};
  DB.sync.push(o); save(); syncChanged(); return o;
}
function syncOf(id){
  const ops = DB.sync.filter(o => o.docId === id);
  if (!ops.length) return null;
  const live = ops.find(o => o.status === 'queued' || o.status === 'sending');
  if (live) return {k: live.attempts && live.lastError ? 'retry' : 'sending', o:live};
  const failed = ops.filter(o => o.status === 'failed');
  if (failed.length) return {k:'failed', o:failed[failed.length-1]};
  return {k:'ok', o:ops[ops.length-1]};
}
function syncChipInner(id){
  const s = syncOf(id); if (!s) return '';
  if (s.k === 'sending') return `<span class="chip info"><i class="spin"></i>${DB.settings.bcOnline ? 'Sending to BC' : 'Waiting for BC'}</span>`;
  if (s.k === 'retry') return `<span class="chip warn"><i class="spin"></i>Retrying ${s.o.attempts}/${RULES.maxAttempts}</span>`;
  if (s.k === 'failed') return `<span class="chip bad">Not in BC</span>`;
  return `<span class="chip good">In BC</span>`;
}
const syncChip = id => `<span data-sync="${id}">${syncChipInner(id)}</span>`;
const inflight = new Set();
function tick(){
  if (!DB.settings.bcOnline) return;
  if (inflight.size >= 2) return;
  const now = Date.now();
  const o = DB.sync.find(x => x.status === 'queued' && (x.nextAt||0) <= now && !inflight.has(x.id));
  if (!o) return;
  o.status = 'sending'; o.attempts++; inflight.add(o.id); syncChanged();
  const lat = DB.settings.latency * (.6 + Math.random()*.8);
  setTimeout(() => {
    inflight.delete(o.id);
    if (!DB.settings.bcOnline){ o.status = 'queued'; o.attempts--; syncChanged(); return; }
    if (Math.random()*100 < DB.settings.failRate){
      o.lastError = BC_ERRORS[Math.floor(Math.random()*BC_ERRORS.length)];
      if (o.attempts >= RULES.maxAttempts){
        o.status = 'failed';
        log('Sync failed', o.docId, `${o.lastError} (${o.attempts} attempts)`, 'Portal');
        notify(o.by, `${o.docId} did not reach BC after ${o.attempts} attempts: ${o.lastError}. Retry from the document.`, o.docId);
        if (o.by === user()?.name) toast(`${o.docId} did not reach BC. Open it to retry.`, 'bad');
      } else { o.status = 'queued'; o.nextAt = Date.now() + 1200 * o.attempts; }
    } else {
      o.status = 'confirmed'; o.done = Date.now(); o.bcRef = 'BC/' + o.docId;
      const d = doc(o.docId); if (d && /order|Release/i.test(o.op) && d.status === 'Released') d.bcRef = d.id;
      if (o.by === user()?.name) toast(`${o.docId} confirmed in BC`, 'good');
      pulse(o.docId);
    }
    save(); syncChanged();
  }, lat);
}
setInterval(tick, 250);
function retry(o){ o.status = 'queued'; o.attempts = 0; o.nextAt = 0; o.lastError = ''; log('Retried sync', o.docId, o.op); save(); syncChanged(); }
function pulse(id){ requestAnimationFrame(() => document.querySelectorAll(`[data-sync="${id}"] .chip`).forEach(c => c.classList.add('pulse'))); }
function syncChanged(){
  document.querySelectorAll('[data-sync]').forEach(el => { const h = syncChipInner(el.dataset.sync); if (el.innerHTML !== h) el.innerHTML = h; });

/* ============ rules ============ */
function aging(no){
  const es = DB.ledger.filter(e => e.cust === no).sort((a,b) => a.date.localeCompare(b.date));
  let credit = -es.filter(e => e.amount < 0).reduce((s,e) => s + e.amount, 0);
  const b = {cur:0, d31:0, d61:0, d90:0};
  es.filter(e => e.amount > 0).forEach(e => {
    let open = e.amount; const use = Math.min(open, credit); open -= use; credit -= use;
    if (open > 0){ const a = ageDays(e.date); if (a <= 30) b.cur += open; else if (a <= 60) b.d31 += open; else if (a <= 90) b.d61 += open; else b.d90 += open; }
  });
  return b;
}
function evaluate(lines, c, kind, branch){
  const reasons = [], warnings = [];
  lines.forEach(l => { if ((l.disc||0) > RULES.maxDiscount) reasons.push(`Line ${l.item}: discount ${l.disc}% is above the ${RULES.maxDiscount}% limit`); });
  const total = lines.reduce((s,l) => s + lineTotal(l), 0);
  if (kind === 'order' && c && c.limit > 0){ const bal = balance(c.no); if (bal + total > c.limit) reasons.push(`Credit check: balance ${KES(bal)} plus this order ${KES(total)} is over the ${KES(c.limit)} limit`); }
  if (kind === 'order' && (!c || c.limit === 0) && lines.length) warnings.push('Cash sale: collect payment before goods leave the store');
  lines.forEach(l => {
    const it = item(l.item); if (!it) return;
    const here = it.stock[branch] || 0;
    if (l.qty > here){
      const inc = incoming(l.item)[0];
      const other = Object.entries(it.stock).filter(([b,q]) => b !== branch && q >= l.qty).map(([b]) => BRANCHES[b]);
      warnings.push(`${l.item}: only ${here} at ${BRANCHES[branch]}` + (other.length ? `; available at ${other.join(', ')}` : '') + (inc ? `; ${inc.qty} arriving ${fmtD(inc.eta)}` : ''));
    }
  });
  return {reasons, warnings, total};
}
function releaseStock(d){ (d.lines || []).forEach(l => { const it = item(l.item); if (it) it.stock[d.branch] = Math.max(0, (it.stock[d.branch]||0) - l.qty); }); }
function applyRequisition(d){
  const j = job(d.job); if (!j) return;
  d.lines.forEach(l => j.entries.push({date:todayISO, type:'Item', ref:l.item, desc:l.desc, qty:l.qty, amount:l.qty*l.price}));
  releaseStock(d); if (j.status === 'Open') j.status = 'In progress';
}

  const phases = [

    {n:4, t:'Stays on BC', p:'Finance and heavy users: journals, GL, debtors and creditors.'},

  <div class="tiles">${tiles}</div>
  <div class="grid g2">
    <section class="card"><h2>Your access</h2>
      <ul class="hist">${granted.map(([,l]) => `<li style="grid-template-columns:16px 1fr"><span style="color:var(--good)">✓</span><span>${esc(l)}</span></li>`).join('')}</ul>
      <p class="muted" style="font-size:12px;margin:12px 0 0">Set by the ${esc(r.label)} role. An admin can change it under Users & roles.</p>
    </section>
    <section class="card"><h2>Rules the portal applies</h2>
      <div class="rule"><span class="k">BC-CONFIRM</span><span>A document is only "In BC" after BC accepts it. Failed sends retry ${RULES.maxAttempts} times, then alert the person who raised it.</span></div>
      <div class="rule"><span class="k">DISC&gt;${RULES.maxDiscount}%</span><span>Any line discount above ${RULES.maxDiscount}% goes to a sales manager.</span></div>
      <div class="rule"><span class="k">CREDIT</span><span>An order that takes an account over its credit limit is held for a manager.</span></div>
      <div class="rule"><span class="k">STOCK</span><span>When the branch is short, the portal shows other branches with stock and the next arrival.</span></div>
      <div class="rule"><span class="k">PETTY&gt;10K</span><span>Petty cash above ${KES(RULES.pettyCashApproverLimit)} needs a manager. Floats switch at ${KES(RULES.floatApproverLimit)}.</span></div>
      <div class="rule"><span class="k">REQ&gt;50K</span><span>Job requisitions up to ${KES(RULES.reqAutoLimit)} release straight to the store; above that a manager approves.</span></div>
      <div class="rule"><span class="k">WARRANTY</span><span>Claims are checked against the invoice date: ${RULES.warrantyMonths} months covered.</span></div>
    </section>
  </div>
  <section class="card"><h2 style="margin-bottom:12px">Rollout</h2>
    <div class="phase">${phases.map(p => `<div class="${p.n === r.phase ? 'on' : ''}"><span class="eyebrow">${p.n < 4 ? 'Phase ' + p.n : 'No move'}</span><b>${p.t}</b><p>${p.p}</p></div>`).join('')}</div>
  </section>
  <section class="card flush"><div class="cardhead"><h2>Recent activity</h2></div>
    <div class="scroll"><table class="t"><thead><tr><th>Date</th><th>Document</th><th>Who</th><th>What happened</th><th>BC</th></tr></thead><tbody>
    ${acts.map(a => `<tr class="click" data-act="open" data-id="${a.id}"><td class="muted">${fmtD(a.date)}</td><td><span class="mono">${a.id}</span> <span class="muted">${esc(a.type)}</span></td><td>${esc(a.who)}</td><td>${esc(a.what)}</td><td>${syncChip(a.id)}</td></tr>`).join('')}
    </tbody></table></div></section>`;
};

VIEWS.customers = () => {
  const q = (state.q.cust || '').toLowerCase();
  const list = DB.customers.filter(c => !q || (c.name + ' ' + c.no + ' ' + c.phone).toLowerCase().includes(q));
  if (!state.sel.cust || !cust(state.sel.cust)) state.sel.cust = list[0]?.no;
  const c = cust(state.sel.cust), led = can('customers.ledger');
  return `
  <div class="head"><div><h1>Customers</h1><p>Search by name, number or phone. ${led ? 'Ledger, statement and purchase history are on each customer.' : 'Purchase history is on each customer.'}</p></div>
  <span class="cache" title="Read from the portal's copy of BC data, refreshed on a schedule">Portal copy refreshed ${ago(DB.settings.cacheAt)}</span></div>
  <div class="split">
    <section class="card flush">
      <div class="searchbar"><input type="search" id="custQ" data-in="q" data-k="cust" placeholder="Search customers" value="${esc(state.q.cust||'')}" aria-label="Search customers"></div>
      <div class="list">${list.map(x => `<button class="li" data-act="sel" data-k="cust" data-id="${x.no}" aria-selected="${x.no === state.sel.cust}">
        <span><b>${esc(x.name)}</b><br><span class="s mono">${x.no}</span> <span class="s">· ${esc(x.group)}</span></span>

    </section>
    <div class="grid" id="detail">${c ? customerDetail(c) : '<div class="card empty">Pick a customer.</div>'}</div>
  </div>`;
};
function customerDetail(c){
  const led = can('customers.ledger');
  const bal = balance(c.no), util = c.limit ? bal / c.limit : 0;
  const tabs = led ? ['Ledger','Statement','Purchases'] : ['Purchases'];
  if (!tabs.includes(state.custTab)) state.custTab = tabs[0];
  let body = '';
  if (state.custTab === 'Ledger'){
    const es = DB.ledger.filter(e => e.cust === c.no).sort((a,b) => a.date.localeCompare(b.date));
    let run = 0; const rows = es.map(e => ({...e, run: run += e.amount})).reverse();
    body = `<div class="scroll"><table class="t"><thead><tr><th>Date</th><th>Type</th><th>Document</th><th>Details</th><th class="num">Debit</th><th class="num">Credit</th><th class="num">Balance</th></tr></thead><tbody>
      ${rows.map(e => `<tr><td class="muted">${fmtD(e.date)}</td><td>${e.type}</td><td class="mono">${e.doc}</td><td>${esc(e.desc)}</td><td class="num">${e.amount > 0 ? KES(e.amount) : ''}</td><td class="num">${e.amount < 0 ? KES(-e.amount) : ''}</td><td class="num">${KES(e.run)}</td></tr>`).join('')}
    </tbody></table></div>`;
  } else if (state.custTab === 'Statement'){
    const days = +(state.q.stmt || 90), from = daysAgo(days);
    const es = DB.ledger.filter(e => e.cust === c.no).sort((a,b) => a.date.localeCompare(b.date));
    const opening = es.filter(e => e.date < from).reduce((s,e) => s + e.amount, 0);
    let run = opening; const rows = es.filter(e => e.date >= from).map(e => ({...e, run: run += e.amount}));
    const a = aging(c.no);
    body = `<div style="padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between">
      <div class="seg" role="group" aria-label="Statement period">${[30,90,180].map(d => `<button data-act="stmt" data-v="${d}" aria-pressed="${d===days}">Last ${d} days</button>`).join('')}</div>
      <span class="muted">${fmtD(from)} to ${fmtD(todayISO)}</span></div>
      <div class="scroll"><table class="t"><thead><tr><th>Date</th><th>Document</th><th>Details</th><th class="num">Amount</th><th class="num">Balance</th></tr></thead><tbody>
      <tr><td class="muted">${fmtD(from)}</td><td></td><td><b>Opening balance</b></td><td></td><td class="num"><b>${KES(opening)}</b></td></tr>
      ${rows.map(e => `<tr><td class="muted">${fmtD(e.date)}</td><td class="mono">${e.doc}</td><td>${e.type}: ${esc(e.desc)}</td><td class="num">${KES(e.amount)}</td><td class="num">${KES(e.run)}</td></tr>`).join('')}
      <tr><td></td><td></td><td><b>Closing balance</b></td><td></td><td class="num"><b>${KES(run)}</b></td></tr>
      </tbody></table></div>
      <div class="scroll" style="border-top:1px solid var(--line)"><table class="t"><thead><tr><th class="num">Current</th><th class="num">31–60 days</th><th class="num">61–90 days</th><th class="num">Over 90 days</th></tr></thead>
      <tbody><tr><td class="num">${KES(a.cur)}</td><td class="num">${KES(a.d31)}</td><td class="num" ${a.d61?'style="color:var(--warn)"':''}>${KES(a.d61)}</td><td class="num" ${a.d90?'style="color:var(--bad);font-weight:600"':''}>${KES(a.d90)}</td></tr></tbody></table></div>`;
  } else {
    const rows = DB.invoices.filter(i => i.cust === c.no).sort((a,b) => b.date.localeCompare(a.date)).flatMap(i => i.lines.map(l => ({...l, date:i.date, doc:i.doc, sp:i.salesperson})));
    body = rows.length ? `<div class="scroll"><table class="t"><thead><tr><th>Date</th><th>Invoice</th><th>Item</th><th class="num">Qty</th><th class="num">Price</th><th>Sold by</th></tr></thead><tbody>
      ${rows.map(l => `<tr><td class="muted">${fmtD(l.date)}</td><td class="mono">${l.doc}</td><td><span class="mono">${l.item}</span><br><span class="muted">${esc(l.desc)}</span></td><td class="num">${l.qty}</td><td class="num">${KES(l.price)}</td><td>${esc(l.sp)}</td></tr>`).join('')}
      </tbody></table></div>` : '<div class="empty">No purchases on record.</div>';
  }
  const lastBuy = DB.invoices.filter(i => i.cust === c.no).sort((a,b) => b.date.localeCompare(a.date))[0];
  return `
  <section class="card">
    <div class="head" style="margin-bottom:14px"><div><div class="eyebrow mono">${c.no}</div><h2 style="font-size:20px">${esc(c.name)}</h2></div>
    ${can('sales.create') ? `<button class="btn primary" data-act="sellTo" data-id="${c.no}">New sale for this customer</button>` : ''}</div>
    <div class="kv">
      <div><span>Group</span><b>${esc(c.group)}</b></div>
      <div><span>Phone</span><b class="mono">${esc(c.phone)}</b></div>
      <div><span>Home branch</span><b>${esc(BRANCHES[c.branch])}</b></div>
      <div><span>Payment terms</span><b>${esc(c.terms)}</b></div>
      <div><span>Last purchase</span><b>${lastBuy ? fmtD(lastBuy.date) + ', ' + esc(lastBuy.salesperson) : '—'}</b></div>
    </div>
    ${led ? (c.limit ? `<div style="margin-top:16px;display:grid;gap:6px">
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><span><span class="muted">Balance</span> <b class="num">${KES(bal)}</b></span><span><span class="muted">Limit</span> <b class="num">${KES(c.limit)}</b></span><span><span class="muted">Available</span> <b class="num" style="color:${c.limit-bal<0?'var(--bad)':'var(--good)'}">${KES(c.limit - bal)}</b></span></div>
      <div class="bar ${util > .9 ? 'bad' : util > .7 ? 'warn' : ''}"><i style="width:${Math.min(100, Math.max(0, util*100)).toFixed(0)}%"></i></div></div>`
      : `<div class="note info" style="margin-top:14px">Cash customer. No credit limit; payment is taken at the counter.</div>`) : ''}
  </section>
  <section class="card flush">
    <div class="tabs" role="tablist" style="padding:0 8px">${tabs.map(t => `<button role="tab" aria-selected="${t === state.custTab}" data-act="custTab" data-v="${t}">${t}</button>`).join('')}</div>
    ${body}
  </section>`;
}

    </tbody></table></div>` : '<div class="empty" style="padding:16px">Nothing on order.</div>'}</section>`;

      </tbody></table></div></section>
  </div>`;
};
function warrantyLookup(cno, ino, receipt){
  const inv = DB.invoices.filter(i => i.cust === cno && i.lines.some(l => l.item === ino)).sort((a,b) => b.date.localeCompare(a.date))[0];
  const date = inv ? inv.date : receipt || '';
  const src = inv ? 'Invoice ' + inv.doc : receipt ? 'Customer receipt (verify the original)' : '';
  if (!date) return {found:false};
  const months = ageDays(date) / 30.44;
  return {found:true, date, src, eligible: months <= RULES.warrantyMonths, months};
}
function warrantyCheckHtml(w){
  const r = warrantyLookup(w.cust, w.item, w.receipt);
  if (!r.found) return `<div class="note warn"><b>No purchase on record</b> for this customer and item. Enter the receipt date, or ask for proof of purchase.</div>`;
  return `<div class="note ${r.eligible ? 'good' : 'bad'}"><b>${r.eligible ? 'In warranty' : 'Out of warranty, chargeable'}</b>: bought ${fmtD(r.date)} (${r.months.toFixed(1)} months ago). Source: ${esc(r.src)}.</div>`;
}

VIEWS.sync = () => {
  const s = DB.settings, f = state.syncFilter;
  const c = k => DB.sync.filter(o => k === 'waiting' ? (o.status === 'queued' || o.status === 'sending') : o.status === k).length;
  const conf = DB.sync.filter(o => o.status === 'confirmed' && o.done);
  const avg = conf.length ? conf.slice(-20).reduce((a,o) => a + (o.done - o.created), 0) / Math.min(20, conf.length) / 1000 : 0;
  const list = DB.sync.slice().reverse().filter(o => f === 'All' || (f === 'Waiting' ? (o.status === 'queued' || o.status === 'sending') : f === 'Failed' ? o.status === 'failed' : o.status === 'confirmed'));
  const stuck = DB.docs.filter(d => { const x = syncOf(d.id); return x && x.k !== 'ok' && Date.now() - x.o.created > 5*60000; });
  return `
  <div class="head"><div><h1>BC sync</h1><p>Every portal write goes through this queue. A transaction is complete only when BC confirms it. Use the controls on the right to test how the portal behaves when BC is slow, flaky or down.</p></div>
    ${c('failed') ? `<button class="btn primary" data-act="retryAll">Retry all failed (${c('failed')})</button>` : ''}</div>
  <div class="tiles">

    <div class="tile static"><span class="v" style="color:${c('failed') ? 'var(--bad)' : 'inherit'}">${c('failed')}</span><span class="l">Failed after ${RULES.maxAttempts} attempts</span></div>
    <div class="tile static"><span class="v">${conf.length}</span><span class="l">Confirmed in BC</span></div>
    <div class="tile static"><span class="v">${avg.toFixed(1)}s</span><span class="l">Average time to confirm (last 20)</span></div>
  </div>
  <div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(260px,320px);align-items:start" id="syncgrid">
    <section class="card flush">
      <div class="tabs" role="tablist" style="padding:0 8px">${['All','Waiting','Failed','Confirmed'].map(t => `<button role="tab" aria-selected="${t===f}" data-act="syncFilter" data-v="${t}">${t}</button>`).join('')}</div>
      <div class="scroll"><table class="t"><thead><tr><th>Transaction</th><th>Document</th><th>Operation</th><th>By</th><th>Status</th><th class="num">Tries</th><th></th></tr></thead><tbody>
      ${list.slice(0,60).map(o => `<tr><td class="mono">${o.id}<br><span class="muted" style="font-family:var(--f-body)">${ago(o.created)}</span></td><td class="mono"><a href="#" data-act="open" data-id="${o.docId}" style="color:var(--accent)">${o.docId}</a></td><td>${esc(o.op)}${o.lastError ? `<br><span style="color:var(--bad);font-size:12px">${esc(o.lastError)}</span>` : ''}</td><td>${esc(o.by)}</td>
        <td>${o.status === 'confirmed' ? '<span class="chip good">Confirmed</span>' : o.status === 'failed' ? '<span class="chip bad">Failed</span>' : o.status === 'sending' ? '<span class="chip info"><i class="spin"></i>Sending</span>' : `<span class="chip ${o.attempts ? 'warn' : ''}">${o.attempts ? 'Retry queued' : 'Queued'}</span>`}</td>
        <td class="num">${o.attempts}</td><td>${o.status === 'failed' ? `<button class="btn sm" data-act="retry" data-id="${o.id}">Retry</button>` : ''}</td></tr>`).join('') || '<tr><td colspan="7" class="empty">Nothing here.</td></tr>'}
      </tbody></table></div>
    </section>
    <div class="grid">
      <section class="card"><h3>BC connection (simulation)</h3>
        <div class="field" style="margin-top:8px"><label>Status</label>
          <div class="seg" role="group" aria-label="BC status"><button data-act="bc" data-v="1" aria-pressed="${s.bcOnline}">Online</button><button data-act="bc" data-v="0" aria-pressed="${!s.bcOnline}">Outage</button></div></div>

        <p class="muted" style="font-size:12px;margin:12px 0 0">Failed sends retry with a growing wait. After ${RULES.maxAttempts} failures the person who raised it is alerted and the document shows "Not in BC".</p></section>
      <section class="card"><h3>Reconciliation</h3>
        ${stuck.length ? `<div class="note bad" style="margin-top:6px"><b>${stuck.length} document${stuck.length>1?'s':''} not in BC after 5 minutes</b><ul>${stuck.slice(0,6).map(d => `<li><a href="#" data-act="open" data-id="${d.id}" style="color:inherit" class="mono">${d.id}</a> ${esc(d.type)}</li>`).join('')}</ul></div>` : `<div class="note good" style="margin-top:6px">Every portal document older than 5 minutes is confirmed in BC.</div>`}

function renderModal(){

}
function openModal(kind, id){ state.modal = {kind, id}; renderModal(); }
function closeModal(){

/* ============ command palette ============ */
function palResults(q){
  q = q.trim().toLowerCase();
  const out = [];
  NAV.filter(allowed).forEach(n => { if (!q || n.label.toLowerCase().includes(q)) out.push({g:'Go to', l:n.label, r:'', run:() => go(n.id)}); });
  if (q){
    if (can('customers.view')) DB.customers.filter(c => (c.name + ' ' + c.no + ' ' + c.phone).toLowerCase().includes(q)).slice(0,5).forEach(c => out.push({g:'Customers', l:c.name, r:c.no, run:() => { state.sel.cust = c.no; go('customers'); }}));
    if (can('items.view')) DB.items.filter(i => (i.no + ' ' + i.desc + ' ' + i.barcode).toLowerCase().includes(q)).slice(0,5).forEach(i => out.push({g:'Items', l:i.desc, r:i.no + ' · ' + KES(i.price), run:() => { state.sel.item = i.no; go('items'); }}));
    DB.docs.filter(d => (d.id + ' ' + d.type + ' ' + (cust(d.cust)?.name||'') + ' ' + d.raisedBy).toLowerCase().includes(q) && (can('sales.view') || !['Quote','Sales order'].includes(d.type) || d.raisedBy === user().name || canApprove(d))).slice(0,6).forEach(d => out.push({g:'Documents', l:d.id + ' ' + d.type, r:d.status, run:() => openModal('doc', d.id)}));
    if (can('jobs.view')) DB.jobs.filter(j => (j.no + ' ' + j.desc + ' ' + (cust(j.cust)?.name||'')).toLowerCase().includes(q)).slice(0,4).forEach(j => out.push({g:'Jobs', l:j.no + ' ' + j.desc, r:j.status, run:() => { state.sel.job = j.no; go('jobs'); }}));
  }
  return out.slice(0,18);
}
function renderPal(){
  const root = document.getElementById('palRoot');
  if (!state.pal){ root.innerHTML = ''; return; }
  const res = palResults(state.pal.q); state.pal.res = res;
  if (state.pal.i >= res.length) state.pal.i = Math.max(0, res.length - 1);
  let g = null;
  const rows = res.map((r,i) => { const head = r.g !== g ? `<div class="g">${r.g}</div>` : ''; g = r.g; return head + `<button class="o" data-act="palRun" data-i="${i}" aria-selected="${i===state.pal.i}"><span>${esc(r.l)}</span><span>${esc(r.r)}</span></button>`; }).join('');
  const fresh = !root.querySelector('.pal');
  if (fresh){
    root.innerHTML = `<div class="pal-ov" data-act="palBg"><div class="pal" role="dialog" aria-label="Search"><input id="palQ" placeholder="Search customers, items, documents, jobs or pages" autocomplete="off" value="${esc(state.pal.q)}"><div class="res" id="palRes">${rows}</div>
      <div class="foot"><span><span class="kbd">↑ ↓</span> move</span><span><span class="kbd">Enter</span> open</span><span><span class="kbd">Esc</span> close</span></div></div></div>`;
    document.getElementById('palQ').focus();
  } else document.getElementById('palRes').innerHTML = rows || '<div class="empty">No matches.</div>';
  root.querySelector('.o[aria-selected="true"]')?.scrollIntoView({block:'nearest'});
}
function openPal(){ state.pop = null; renderPop(); state.pal = {q:'', i:0}; renderPal(); }
function closePal(){ state.pal = null; renderPal(); }

/* ============ cart ============ */
function addToCart(no, qty = 1){
  const it = item(no); if (!it) return;
  const l = state.cart.lines.find(x => x.item === no);
  if (l) l.qty += qty; else state.cart.lines.push({item:no, desc:it.desc, qty, price:it.price, disc:0});
  state.flash = no;
}
function submitSale(){
  const cart = state.cart, c = cust(cart.cust), u = user();
  const ev = evaluate(cart.lines, c, cart.kind, state.branch);
  const isOrder = cart.kind === 'order';
  const d = {id: nextId(isOrder ? 'SO' : 'SQ'), type: isOrder ? 'Sales order' : 'Quote', cust: cart.cust, branch: state.branch, raisedBy: u.name, date: todayISO, lines: cart.lines.map(l => ({...l})), reasons: ev.reasons, history: []};
  hist(d, u.name, isOrder ? 'Placed order' : 'Created quote');
  if (ev.reasons.length){ d.status = 'Pending approval'; d.needs = 'manager'; hist(d, 'Portal', 'Sent for approval: ' + ev.reasons.map(r => r.split(':')[0]).join('; ')); }
  else if (isOrder){ d.status = 'Released'; releaseStock(d); hist(d, 'Portal', 'Released'); }
  else d.status = 'Open';
  DB.docs.unshift(d);
  log(isOrder ? 'Placed order' : 'Created quote', d.id, `${KES(docTotal(d))}${ev.reasons.length ? ' · held for approval' : ''}`);
  enqueue(d.id, isOrder ? 'Create sales order' : 'Create quote');
  state.cart = {lines:[], cust:'', kind:'order'};
  toast(d.status === 'Pending approval' ? `${d.id} sent for approval` : `${d.id} saved. Sending to BC…`);
  openModal('doc', d.id); renderMain(false);
}

/* ============ actions ============ */
const ACT = {
  signin: el => { prefs.uid = el.dataset.id; const u = user(); state.branch = u.branch; prefs.branch = u.branch; savePrefs(); log('Signed in', u.id, DB.roles[u.role].label, u.name); save(); state.view = 'home'; state.lastView = null; renderApp(); },
  signout: () => { log('Signed out', user().id, ''); save(); prefs.uid = null; savePrefs(); state.pop = null; state.modal = null; renderModal(); renderApp(); },
  go: el => { if (el.dataset.low) state.lowOnly = true; go(el.dataset.v); },
  openFailed: () => { const o = DB.sync.find(x => x.status === 'failed' && x.by === user().name); if (o) openModal('doc', o.docId); },
  sel: el => { state.sel[el.dataset.k] = el.dataset.id; renderMain(false); },
  custTab: el => { state.custTab = el.dataset.v; renderMain(false); },
  stmt: el => { state.q.stmt = el.dataset.v; renderMain(false); },
  ssTab: el => { state.ssTab = el.dataset.v; state.errors.self = null; renderMain(false); },
  salesFilter: el => { state.salesFilter = el.dataset.v; renderMain(false); },
  syncFilter: el => { state.syncFilter = el.dataset.v; renderMain(false); },
  adminTab: el => { state.adminTab = el.dataset.v; renderMain(false); },
  kind: el => { state.cart.kind = el.dataset.v; renderMain(false); },
  clearLow: () => { state.lowOnly = false; renderMain(false); },
  addItem: el => { addToCart(el.dataset.id); toast(el.dataset.id + ' added'); state.q.scan = ''; state.scanMsg = ''; renderMain(false); renderNavCounts(); if (state.view === 'counter') document.getElementById('scanQ')?.focus(); },
  tpl: el => { const t = TEMPLATES.find(x => x.id === el.dataset.id); t.lines.forEach(([n,q]) => addToCart(n,q)); state.flash = null; toast(t.name + ' added'); renderMain(false); },
  qty: el => { const l = state.cart.lines[+el.dataset.i]; l.qty = Math.max(1, l.qty + (+el.dataset.d)); renderMain(false); },
  rm: el => { state.cart.lines.splice(+el.dataset.i, 1); renderMain(false); },
  clearCart: () => { state.cart.lines = []; renderMain(false); },
  submitSale,
  sellTo: el => { state.cart.cust = el.dataset.id; go('counter'); },
  open: el => openModal('doc', el.dataset.id),
  openW: el => openModal('w', el.dataset.id),
  close: closeModal,
  closeBg: (el, e) => { if (e.target === el) closeModal(); },
  approve: el => decide(el.dataset.id, true),
  reject: el => decide(el.dataset.id, false),
  retry: el => { const o = DB.sync.find(x => x.id === el.dataset.id); if (o){ retry(o); toast(`${o.docId} queued for BC again`); renderModal(); } },
  retryAll: () => { const f = DB.sync.filter(o => o.status === 'failed'); f.forEach(retry); toast(`${f.length} queued for BC again`); },
  bc: el => { DB.settings.bcOnline = el.dataset.v === '1'; log(DB.settings.bcOnline ? 'BC back online' : 'BC outage started', 'BC', 'Simulation'); save(); syncChanged(); renderMain(false); toast(DB.settings.bcOnline ? 'BC is back. Sending queued work.' : 'BC outage: work will queue in the portal'); },
  convert: el => {
    const q = doc(el.dataset.id), c = cust(q.cust), u = user();
    const ev = evaluate(q.lines.map(l => ({...l, disc: q.status === 'Approved' ? 0 : l.disc})), c, 'order', q.branch);
    const reasons = ev.reasons.filter(r => !r.startsWith('Line'));
    const d = {id: nextId('SO'), type:'Sales order', cust:q.cust, branch:q.branch, raisedBy:u.name, date:todayISO, lines:q.lines.map(l => ({...l})), reasons, from:q.id, history:[]};
    hist(d, u.name, 'Converted from quote ' + q.id);
    if (reasons.length){ d.status = 'Pending approval'; d.needs = 'manager'; hist(d, 'Portal', 'Held for approval: credit limit'); }
    else { d.status = 'Released'; releaseStock(d); hist(d, 'Portal', 'Released'); }
    q.status = 'Converted'; hist(q, u.name, 'Converted to order ' + d.id);
    DB.docs.unshift(d); log('Converted quote', q.id, 'to ' + d.id); enqueue(d.id, 'Create sales order');
    state.modal = {kind:'doc', id:d.id}; renderModal(); renderMain(false);
    toast(d.status === 'Released' ? `${d.id} released. Sending to BC…` : `${d.id} held for credit approval`);
  },
  wDecide: el => {
    const w = DB.warranty.find(x => x.no === el.dataset.id); w.status = el.dataset.v;
    const j = job(w.job); if (j && el.dataset.v !== 'Rejected') j.status = 'In progress';
    log('Warranty decision', w.no, w.status); enqueue(w.no, 'Update warranty claim'); save(); toast(`${w.no}: ${w.status}`); renderModal(); renderMain(false);
  },
  reset: () => { DB = seed(); save(); const u = DB.users.find(x => x.id === prefs.uid); if (!u) prefs.uid = null; state.cart = {lines:[], cust:'', kind:'order'}; state.modal = null; state.pop = null; state.sel = {}; renderModal(); renderApp(); toast('Sample data restored'); },
  resetRoles: () => { DB.roles = JSON.parse(JSON.stringify(DEFAULT_ROLES)); log('Restored default roles', 'Roles', ''); save(); refreshAfterRoleChange(); toast('Default permissions restored'); },
  toggleUser: el => { const u = DB.users.find(x => x.id === el.dataset.id); u.active = !u.active; log(u.active ? 'Reactivated user' : 'Deactivated user', u.name, ''); save(); renderMain(false); toast(`${u.name} ${u.active ? 'reactivated' : 'deactivated'}`); },
  pop: el => { state.pop = state.pop === el.dataset.v ? null : el.dataset.v; if (state.pop === 'bell') {} renderPop(); },
  pref: el => { prefs[el.dataset.k] = el.dataset.v; savePrefs(); applyPrefs(); renderPop(); },
  readAll: () => { myNotes().forEach(n => n.read = true); save(); renderPop(); renderNavCounts(); },
  note: el => { const n = DB.notes[+el.dataset.i]; n.read = true; save(); state.pop = null; renderPop(); renderNavCounts(); if (n.doc && doc(n.doc)) openModal('doc', n.doc); },
  palette: openPal,
  palBg: (el, e) => { if (e.target === el) closePal(); },
  palRun: el => { const r = state.pal.res[+el.dataset.i]; closePal(); r && r.run(); },
};
function refreshAfterRoleChange(){ document.getElementById('side').innerHTML = navHtml(); renderMain(false); renderNavCounts(); }
function decide(id, ok){
  const d = doc(id), who = user().name, comment = (document.getElementById('apComment')?.value || '').trim();
  if (!ok && !comment){ const e = document.getElementById('apErr'); if (e) e.textContent = 'Add a comment so ' + d.raisedBy + ' knows why.'; document.getElementById('apComment')?.focus(); return; }
  if (ok){
    if (d.type === 'Sales order'){ d.status = 'Released'; releaseStock(d); hist(d, who, 'Approved'); hist(d, 'Portal', 'Released'); }
    else if (d.type === 'Job requisition'){ d.status = 'Released'; applyRequisition(d); hist(d, who, 'Approved'); hist(d, 'Portal', 'Released from store'); }
    else { d.status = 'Approved'; hist(d, who, 'Approved'); }
  } else { d.status = 'Rejected'; hist(d, who, 'Rejected'); }
  if (comment) hist(d, who, 'Comment: ' + comment);
  log(ok ? 'Approved' : 'Rejected', d.id, comment);
  notify(d.raisedBy, `${d.id} ${d.type.toLowerCase()} was ${ok ? 'approved' : 'rejected'} by ${who}${comment ? ': "' + comment + '"' : ''}.`, d.id);
  enqueue(d.id, (ok ? 'Approve ' : 'Reject ') + d.type.toLowerCase());
  save(); toast(`${d.id} ${ok ? 'approved' : 'rejected'}. Sending to BC…`); renderModal(); renderMain(false);
}

/* ============ events ============ */
document.addEventListener('click', e => {
  if (state.pop && !e.target.closest('.pop') && !e.target.closest('[data-act="pop"]')){ state.pop = null; renderPop(); }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const f = ACT[el.dataset.act]; if (!f) return;
  if (!['closeBg','palBg'].includes(el.dataset.act)) e.preventDefault();
  f(el, e);
});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k' && user()){ e.preventDefault(); state.pal ? closePal() : openPal(); return; }
  if (state.pal){
    if (e.key === 'Escape'){ closePal(); return; }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); const n = state.pal.res.length; if (n){ state.pal.i = (state.pal.i + (e.key === 'ArrowDown' ? 1 : -1) + n) % n; renderPal(); } return; }
    if (e.key === 'Enter'){ e.preventDefault(); const r = state.pal.res[state.pal.i]; closePal(); r && r.run(); return; }
    return;
  }
  if (e.key === 'Escape'){ if (state.modal) closeModal(); else if (state.pop){ state.pop = null; renderPop(); } }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'palQ'){ state.pal.q = el.value; state.pal.i = 0; renderPal(); return; }
  const k = el.dataset.in; if (!k) return;
  if (k === 'q'){ state.q[el.dataset.k] = el.value; if (el.dataset.k === 'scan') state.scanMsg = ''; renderMain(false); }
  else if (k === 'audit'){ state.auditQ = el.value; renderMain(false); }
  else if (k === 'lineQty'){ const v = parseInt(el.value, 10); if (v > 0){ state.cart.lines[+el.dataset.i].qty = v; renderMain(false); } }
  else if (k === 'lineDisc'){ state.cart.lines[+el.dataset.i].disc = Math.min(100, Math.max(0, parseFloat(el.value) || 0)); renderMain(false); }
  else if (k === 'latency'){ DB.settings.latency = +el.value; document.getElementById('latV').textContent = (el.value/1000).toFixed(1) + ' s'; save(); }
  else if (k === 'failRate'){ DB.settings.failRate = +el.value; document.getElementById('failV').textContent = el.value + '%'; save(); }
  else if (k === 'licence'){ const n = +el.value; state.licenceUsers = n; document.getElementById('licV').textContent = n; document.getElementById('licS').textContent = KES(n*250000); document.getElementById('licL').textContent = 936 - n; document.getElementById('licN').textContent = Math.min(60, n) + ' of 60'; }
  else if (k === 'wText'){ state.w = state.w || {cust:'C10102', item:'PKM60', receipt:'', serial:'', fault:''}; state.w[el.name] = el.value; }
});
document.addEventListener('change', e => {
  const el = e.target, k = el.dataset.in; if (!k) return;
  if (k === 'cat'){ state.itemCat = el.value; renderMain(false); }
  else if (k === 'branch'){ state.branch = el.value; prefs.branch = el.value; savePrefs(); renderMain(false); }
  else if (k === 'cartCust'){ state.cart.cust = el.value; renderMain(false); }
  else if (k === 'wCheck'){ state.w = state.w || {cust:'C10102', item:'PKM60', receipt:'', serial:'', fault:''}; state.w[el.name] = el.value; renderMain(false); }
  else if (k === 'switchUser'){ prefs.uid = el.value; const u = user(); state.branch = u.branch; prefs.branch = u.branch; savePrefs(); log('Signed in', u.id, DB.roles[u.role].label, u.name); save(); state.pop = null; state.modal = null; state.lastView = null; renderModal(); renderApp(); toast('Signed in as ' + u.name); }
  else if (k === 'userRole'){ const u = DB.users.find(x => x.id === el.dataset.id), from = DB.roles[u.role].label; u.role = el.value; log('Changed role', u.name, `${from} → ${DB.roles[u.role].label}`); save(); toast(`${u.name} is now ${DB.roles[u.role].label}`); }
  else if (k === 'userBranch'){ const u = DB.users.find(x => x.id === el.dataset.id); u.branch = el.value; log('Changed branch', u.name, BRANCHES[u.branch]); save(); }
  else if (k === 'perm'){
    const r = DB.roles[el.dataset.r], p = el.dataset.p;
    if (el.checked){ if (!r.perms.includes(p)) r.perms.push(p); } else r.perms = r.perms.filter(x => x !== p);
    log(el.checked ? 'Granted permission' : 'Removed permission', r.label, p); save(); refreshAfterRoleChange();
  }
});
document.addEventListener('submit', e => {
  const f = e.target, kind = f.dataset.form; if (!kind) return;
  e.preventDefault();
  const u = user();
  if (kind === 'scan'){
    const q = (state.q.scan || '').trim().toLowerCase(); if (!q) return;
    const exact = DB.items.find(i => i.barcode === q || i.no.toLowerCase() === q);
    const hits = DB.items.filter(i => (i.no + ' ' + i.desc + ' ' + i.barcode).toLowerCase().includes(q));
    const it = exact || (hits.length === 1 ? hits[0] : null);
    if (it){ addToCart(it.no); state.q.scan = ''; state.scanMsg = ''; toast(it.no + ' added'); }
    else state.scanMsg = hits.length ? `${hits.length} items match "${state.q.scan}". Tap one below.` : `No item with code or barcode "${state.q.scan}".`;
    renderMain(false); document.getElementById('scanQ')?.focus(); return;
  }
  if (kind === 'req'){
    const j = job(state.sel.job), it = item(f.item.value), qty = parseInt(f.qty.value, 10);
    if (!(qty > 0)){ state.errors.req = {qty:'Enter a quantity of 1 or more'}; renderMain(false); return; }
    state.errors.req = null;
    const d = {id: nextId('JR'), type:'Job requisition', job:j.no, branch:j.branch, raisedBy:u.name, date:todayISO, lines:[{item:it.no, desc:it.desc, qty, price:it.price, disc:0}], history:[]};
    const amt = qty * it.price, short = qty > (it.stock[j.branch] || 0);
    hist(d, u.name, 'Requisitioned into ' + j.no);
    if (amt > RULES.reqAutoLimit){ d.status = 'Pending approval'; d.needs = 'manager'; d.reasons = [`Value ${KES(amt)} is above the ${KES(RULES.reqAutoLimit)} limit`]; hist(d, 'Portal', 'Sent for approval: value above limit'); }
    else { d.status = 'Released'; applyRequisition(d); hist(d, 'Portal', 'Released from store'); }
    DB.docs.unshift(d); log('Requisitioned', d.id, `${qty} × ${it.no} into ${j.no}`);
    enqueue(d.id, 'Post requisition to ' + j.no);
    toast(d.status === 'Released' ? `${d.id} released${short ? ' (store short, backordered)' : ''}. Sending to BC…` : `${d.id} sent for approval`);
    renderMain(false); return;
  }
  if (kind === 'warranty'){
    const errs = {};
    if (!f.serial.value.trim()) errs.serial = 'Enter the serial number from the unit';
    if (!f.fault.value.trim()) errs.fault = 'Describe the fault';
    const lk = warrantyLookup(f.cust.value, f.item.value, f.receipt.value);
    state.w = {cust:f.cust.value, item:f.item.value, receipt:f.receipt.value, serial:f.serial.value, fault:f.fault.value};
    if (Object.keys(errs).length){ state.errors.warranty = errs; renderMain(false); return; }
    if (!lk.found){ toast('Add a receipt date or proof of purchase first', 'bad'); return; }
    state.errors.warranty = null;
    const c = cust(f.cust.value), it = item(f.item.value);
    const jno = 'JOB-' + (DB.seq.JOB++);
    DB.jobs.unshift({no:jno, cust:c.no, desc:'Warranty assessment: ' + it.desc, branch:state.branch, engineer:u.name, status:'Open', opened:todayISO, entries:[], attachments:[]});
    const w = {no:'WC-' + (DB.seq.WC++), cust:c.no, item:it.no, serial:f.serial.value.trim(), purchased:lk.date, source:lk.src, eligible:lk.eligible, fault:f.fault.value.trim(), status:'Under assessment', job:jno, date:todayISO};
    DB.warranty.unshift(w); state.w = null;
    log('Logged warranty claim', w.no, `${it.no} · ${lk.eligible ? 'in warranty' : 'expired'} · opened ${jno}`);
    enqueue(w.no, 'Create warranty claim and job');
    toast(`${w.no} logged, ${jno} opened`); openModal('w', w.no); renderMain(false); return;
  }
  if (kind === 'self'){
    const t = state.ssTab, errs = {}, v = n => f[n] ? f[n].value.trim() : '';
    if (t === 'Petty cash' || t === 'Float'){ if (!(+v('amount') > 0)) errs.amount = 'Enter an amount above zero'; if (!v('reason')) errs.reason = t === 'Float' ? 'Say what the advance is for' : 'Say what the money was spent on'; }
    if (t === 'Float' && v('retire') && v('retire') < todayISO) errs.retire = 'The retire date cannot be in the past';
    if (t === 'Purchase request'){ if (!(+v('qty') > 0)) errs.qty = 'Enter 1 or more'; if (!v('reason')) errs.reason = 'Give a reason'; }
    if (t === 'RFQ'){ if (!v('desc')) errs.desc = 'Describe what you need'; if (!(+v('qty') > 0)) errs.qty = 'Enter 1 or more'; }
    if (Object.keys(errs).length){ state.errors.self = errs; renderMain(false); return; }
    state.errors.self = null;
    let d;
    if (t === 'Petty cash'){
      const amt = +v('amount');
      d = {id:nextId('PC'), type:t, branch:state.branch, raisedBy:u.name, date:todayISO, amount:amt, purpose:v('purpose'), reason:v('reason'), attachments: f.file.files[0] ? [f.file.files[0].name] : [], history:[]};
      d.needs = amt > RULES.pettyCashApproverLimit ? 'manager' : 'approver';
      if (d.needs === 'manager') d.reasons = [`Amount is above ${KES(RULES.pettyCashApproverLimit)}, so a manager approves`];
    } else if (t === 'Float'){
      const amt = +v('amount');
      d = {id:nextId('FL'), type:t, branch:state.branch, raisedBy:u.name, date:todayISO, amount:amt, purpose:'Advance', reason:v('reason'), retire:v('retire'), history:[]};
      d.needs = amt > RULES.floatApproverLimit ? 'manager' : 'approver';
      if (d.needs === 'manager') d.reasons = [`Amount is above ${KES(RULES.floatApproverLimit)}, so a manager approves`];
    } else if (t === 'Purchase request'){
      const it = item(v('item'));
      d = {id:nextId('PR'), type:t, branch:v('branch'), raisedBy:u.name, date:todayISO, lines:[{item:it.no, desc:it.desc, qty:+v('qty'), price:it.cost, disc:0}], reason:v('reason'), needs:'approver', history:[]};
    } else {
      d = {id:nextId('RFQ'), type:'RFQ', branch:v('branch'), raisedBy:u.name, date:todayISO, rfqType:v('rfqType'), reason:v('reason'), lines:[{item:'—', desc:v('desc'), qty:+v('qty'), price:0, disc:0}], status:'Sent to procurement', history:[]};
      hist(d, u.name, 'Sent to procurement');
    }
    if (!d.status){ d.status = 'Pending approval'; hist(d, u.name, 'Submitted for approval'); }
    DB.docs.unshift(d); log('Submitted', d.id, `${d.type}${docTotal(d) ? ' ' + KES(docTotal(d)) : ''}`);
    enqueue(d.id, t === 'RFQ' ? 'Send RFQ to procurement' : 'Create ' + t.toLowerCase());
    toast(d.status === 'Sent to procurement' ? `${d.id} sent to procurement` : `${d.id} submitted to ${d.needs === 'manager' ? 'a manager' : 'your branch approver'}`);
    f.reset(); renderMain(false); return;
  }
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (VIEWS[h] && h !== state.view && user()){ state.view = h; renderMain(true); } });
setInterval(() => { if (state.view === 'sync' || state.view === 'customers' || state.view === 'items') { document.querySelectorAll('.cache').forEach(c => c.textContent = 'Portal copy refreshed ' + ago(DB.settings.cacheAt)); } }, 30000);

/* ============ boot ============ */
const h0 = location.hash.slice(1); if (VIEWS[h0]) state.view = h0;
renderApp();
</script>
